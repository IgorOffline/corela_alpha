cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [
    "corela_core",
    "corela_adahira",
    "corela_helena",
    "corela_alexandria",
    "corela_model",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
corela_adahira = { path = "corela_adahira" }
corela_helena = { path = "corela_helena" }
corela_alexandria = { path = "corela_alexandria" }
corela_model = { path = "corela_model" }
macroquad = { version = "=0.4.16", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"

# === === ===
# lints
# === === ===
# The Rust counterpart of `clang -Weverything -Werror` plus clang-tidy's
# bugprone-*, cert-*, cppcoreguidelines-*, hicpp-* and clang-analyzer-*.
# Like Clang's -W flags these only warn, so `cargo build` keeps working; the
# -Werror step is `cargo clippy --all-targets -- -D warnings`. Silence a single
# site with `#[expect(clippy::lint, reason = "...")]`, the counterpart of
# `// NOLINT(...)` with a justification. Thresholds live in clippy.toml.

[workspace.lints.rust]
# -Wunused -Wunused-macros -Wunused-template -Wunused-member-function
unused = { level = "warn", priority = -1 }
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unit_bindings = "warn"
# -Wmissing-prototypes -Wmissing-variable-declarations: no accidental exports
unreachable_pub = "warn"
# -Wcast-qual -Wuseless-cast
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# -Wdeprecated -Wfuture-compat
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
keyword_idents = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
meta_variable_misuse = "warn"
let_underscore_drop = "warn"
# cppcoreguidelines-pro-type-* / cert-exp*: corela is pure Rust on top of
# macroquad, so there is no unsafe code to justify
unsafe_code = "forbid"
# -Wbidi-chars -Wunicode-homoglyph (Trojan Source, CVE-2021-42574)
non_ascii_idents = "warn"
text_direction_codepoint_in_comment = "forbid"
text_direction_codepoint_in_literal = "forbid"

[workspace.lints.clippy]
# -Weverything: every non-restriction group
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# private, path-only workspace: no crates.io metadata, and vendored deps pin
# their own versions
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
# house style (report 1000, pass 2): explicit `match`, no `let ... else`, no
# `map_or(|..| ..)` closures
manual_let_else = "allow"
option_if_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# contradicts rustc's unreachable_pub, which wants `pub(crate)` in a binary
redundant_pub_crate = "allow"
# `a.mul_add(b, c)` hides the geometry formulas; pixel coordinates do not
# need the extra rounding step it saves
suboptimal_flops = "allow"

# --- restriction picks ---
# clang-analyzer-core.NullDereference / bugprone-unchecked-optional-access
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
get_unwrap = "warn"
# -Warray-bounds -fsanitize=bounds / cppcoreguidelines-pro-bounds-*
indexing_slicing = "warn"
string_slice = "warn"
# cppcoreguidelines-pro-type-cstyle-cast / -Wold-style-cast
as_conversions = "warn"
as_underscore = "warn"
as_pointer_underscore = "warn"
fn_to_numeric_cast_any = "warn"
ptr_cast_constness = "warn"
# -Wfloat-equal
float_cmp_const = "warn"
lossy_float_literal = "warn"
# -Wshadow-all
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
# -Wswitch-enum / bugprone-switch-missing-default-case
wildcard_enum_match_arm = "warn"
# cert-int33-c / cert-int10-c: truncating division, sign of negative remainders
integer_division = "warn"
modulo_arithmetic = "warn"
# -Wparentheses on bit ops / -Wshift-op-parentheses
precedence_bits = "warn"
# cert-mem31-c / clang-analyzer-unix.Malloc (leaks)
mem_forget = "warn"
# cert-err33-c / bugprone-unused-return-value
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
# cert-err50-cpp / cert-env32-c: no abrupt termination
panic = "warn"
exit = "warn"
# leftover debugging / unfinished code (-W#warnings)
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
# NOLINT without a justification
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# no Clang counterpart: diagnostics go through `log`, assertions say why
print_stdout = "warn"
print_stderr = "warn"
missing_assert_message = "warn"

[profile.dev]
panic = "abort"

# macroquad's own advice: dependencies (fontdue, image, glam) are far too slow
# unoptimized; corela's crates stay at opt-level 0 for debugging
[profile.dev.package."*"]
opt-level = 3

# memchr 2.8.3, the newest release, uses core::u8::MAX and core::u32::MAX, which
# this nightly deprecates; vendored sources are never edited
[profile.dev.package.memchr]
rustflags = ["-Adeprecated"]

[profile.release]
panic = "abort"
# integer overflow aborts instead of wrapping, like dev builds already do
# (the runtime counterpart of clang's -ftrapv)
overflow-checks = true

[profile.release.package.memchr]
rustflags = ["-Adeprecated"]

