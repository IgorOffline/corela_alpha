indexmap_toml = { package = "indexmap", path = "../../../rust_vendor/toml/current/indexmap-2.14.2" }
proc-macro2_toml = { package = "proc-macro2", path = "../../../rust_vendor/toml/current/proc-macro2-1.0.107" }
quote_toml = { package = "quote", path = "../../../rust_vendor/toml/current/quote-1.0.47" }
serde_derive_toml = { package = "serde_derive", path = "../../../rust_vendor/toml/current/serde_derive-1.0.229" }
syn_toml = { package = "syn", path = "../../../rust_vendor/toml/current/syn-3.0.5" }
unicode-ident_toml = { package = "unicode-ident", path = "../../../rust_vendor/toml/current/unicode-ident-1.0.24" }
