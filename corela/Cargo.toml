[workspace]
resolver = "3"
members = ["corela_core", "corela_gfx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"

[workspace.dependencies]
corela_gfx = { path = "corela_gfx" }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
cc = "1"
env_logger = { version = "0.11", default-features = false }
log = "0.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[patch.crates-io]
# === === ===
# env_logger
# === === ===
env_logger = { path = "../../rust_vendor/env_logger/current/env_logger-0.11.11" }
env_filter = { path = "../../rust_vendor/env_logger/current/env_filter-2.0.0" }
log = { path = "../../rust_vendor/env_logger/current/log-0.4.34" }

# === === ===
# sokol
# === === ===
cc = { path = "../../rust_vendor/cc/current" }
shlex = { path = "../../rust_vendor/shlex/current" }
find-msvc-tools = { path = "../../rust_vendor/find-msvc-tools/current" }

# === === ===
# toml
# === === ===
toml_toml = { package = "toml", path = "../../rust_vendor/toml/current/toml-1.1.6+spec-1.1.0" }
toml_datetime_toml = { package = "toml_datetime", path = "../../rust_vendor/toml/current/toml_datetime-1.1.1+spec-1.1.0" }
toml_parser_toml = { package = "toml_parser", path = "../../rust_vendor/toml/current/toml_parser-1.1.3+spec-1.1.0" }
toml_writer_toml = { package = "toml_writer", path = "../../rust_vendor/toml/current/toml_writer-1.1.2+spec-1.1.0" }
serde_spanned_toml = { package = "serde_spanned", path = "../../rust_vendor/toml/current/serde_spanned-1.1.1" }
serde_core_toml = { package = "serde_core", path = "../../rust_vendor/toml/current/serde_core-1.0.229" }
winnow_toml = { package = "winnow", path = "../../rust_vendor/toml/current/winnow-1.0.4" }
equivalent_toml = { package = "equivalent", path = "../../rust_vendor/toml/current/equivalent-1.0.2" }
